name: Quality gates
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-startup:
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
          python-version: '3.12'
      - name: Check Windows startup and diagnostics without credentials
        run: uv run --no-project --with pytest==9.2.0 python -m pytest services/api/tests/test_doctor.py services/api/tests/test_windows_startup.py -q
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
          python-version: '3.12'
      - run: uv venv --python 3.12 .venv
      - run: uv pip sync services/api/requirements.lock
      - run: uv pip install --no-deps -e services/api
      - run: npm ci
      - name: Install local media codecs and fonts for real studio tests
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: .venv/bin/python -m pytest services/api/tests -q
      - run: .venv/bin/python -m ruff check services/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
