[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-team-api"
version = "0.2.0"
description = "API e executor privado da plataforma AI TEAM"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "argon2-cffi>=23,<26", "pydantic-settings>=2,<3",
  "langgraph>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "httpx>=0.28,<1", "httpx2>=2,<3", "ruff>=0.14,<1"]

[project.scripts]
ai-team = "ai_team.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_team*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
